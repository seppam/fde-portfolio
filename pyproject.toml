[project]
name = "po-agent"
version = "0.1.0"
description = "PO Agent: turns shop purchase orders (PDF, photo, Excel) into draft ERP sales orders with a human in the loop. FDE portfolio project, fictional client."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pydantic>=2.8",
  "rapidfuzz>=3.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "openpyxl>=3.1",
  "pillow>=10.4",
  "pypdf>=6.21.4",
  "pypdfium2>=5.14.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "reportlab>=4.2",
  "playwright>=1.47",
  "pytest-playwright>=0.5",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/po_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "llm: calls a real LLM API (skipped unless RUN_LLM_TESTS=1)",
  "odoo: needs the local Odoo from odoo-lab (skipped unless RUN_ODOO_TESTS=1)",
  "e2e: browser tests with Playwright",
]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's File()/Form() defaults are the framework idiom.
# BLE001: the two broad catches are deliberate (one bad attachment / one failed PO must not stop a batch).
ignore = ["B008", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"evals/*" = ["E402"]
"tests/*" = ["E402"]
