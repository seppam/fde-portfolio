name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"

jobs:
  # Cheap and fast first: lint, unit and API tests. No LLM calls, no keys needed.
  fast:
    name: lint + unit + api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Unit + API tests
        run: uv run pytest -m "not e2e and not llm and not odoo" --cov=po_agent --cov-report=term

  # Browser tests against the real app with a fake extractor and the mock ERP.
  e2e:
    name: e2e (Playwright)
    needs: fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest tests/e2e -m e2e
