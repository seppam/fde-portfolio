<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}PO Agent{% endblock %} · Kenari Distribusi (demo)</title>
<script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
<style>
:root{--bg:#f5f6f4;--paper:#fff;--ink:#1d2321;--muted:#5f6a66;--line:#dde1dc;--accent:#a14514;--accent-soft:#f8e8dc;
--ok:#1f7a4d;--ok-soft:#e2f3ea;--warn:#8a5a00;--warn-soft:#fbf1dc;--bad:#a3312a;--bad-soft:#fbeceb;--info:#2d5f94;--info-soft:#e6eef8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--ink);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:16px}
header a{color:#fff;text-decoration:none;font-weight:700}header .demo{font-size:12px;opacity:.75}
main{max-width:1280px;margin:0 auto;padding:20px 24px 60px}
h1{font-size:22px;margin:4px 0 14px}h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600}
.s-ready,.s-approved{background:var(--ok-soft);color:var(--ok)}.s-needs_review{background:var(--warn-soft);color:var(--warn)}
.s-blocked,.s-rejected{background:var(--bad-soft);color:var(--bad)}
.flag{padding:7px 10px;border-radius:6px;margin:5px 0;font-size:14px}.f-block{background:var(--bad-soft);color:var(--bad)}
.f-warn{background:var(--warn-soft);color:var(--warn)}.f-info{background:var(--info-soft);color:var(--info)}
.conf{font-size:12px;color:var(--muted)}.m-alias,.m-admin{color:var(--ok)}.m-llm{color:var(--info)}.m-none{color:var(--bad)}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--paper);padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--ink);text-decoration:none}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}button:disabled{opacity:.45;cursor:not-allowed}
button.danger{color:var(--bad)}select,input{font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);max-width:100%}
.grid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:18px}
[data-testid=lines]{font-size:14px}[data-testid=lines] select[name=sku]{width:100%;max-width:240px}[data-testid=lines] td:first-child{max-width:150px;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto}
.doc{position:sticky;top:12px}.doc iframe,.doc img{width:100%;height:78vh;border:1px solid var(--line);border-radius:8px;background:#fff;object-fit:contain}
.doc pre{max-height:78vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:13px}
.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.msg{padding:10px 12px;border-radius:8px;background:var(--info-soft);color:var(--info);margin-bottom:10px}
.notes{background:#fffbe9;border:1px dashed #d8b45a;padding:8px 10px;border-radius:6px;font-size:13.5px;white-space:pre-wrap}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font-size:22px}.htmx-request{opacity:.6}
@media (max-width:900px){.grid{grid-template-columns:1fr}.doc{position:static}.doc iframe,.doc img{height:60vh}main{padding:16px}}
</style>
</head>
<body>
<header><a href="/">PO Agent</a><span class="demo">PT Kenari Distribusi · fictional demo data</span></header>
<main>{% block body %}{% endblock %}</main>
<script>
document.body.addEventListener("htmx:responseError", e => {
  let msg = "Request failed";
  try { msg = JSON.parse(e.detail.xhr.responseText).error || msg } catch (_) {}
  alert(msg);
});
</script>
</body>
</html>
