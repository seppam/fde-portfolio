# Local services for PO Agent. Ports chosen to avoid Simpang (5433) and Supabase stacks.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: po
      POSTGRES_PASSWORD: po
      POSTGRES_DB: po_agent
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U po -d po_agent"]
      interval: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:latest
    ports: ["8026:8025", "1026:1025"]
volumes:
  pgdata:
